spring.application.name=music-api

# Configuracaoo do Banco de Dados PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/serratec_music
spring.datasource.username=postgres
spring.datasource.password=123456

# Configuracao do JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuracao do Swagger/OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Pacotes a escanear (opcional)
spring.jpa.packages-to-scan=com.serratec.music_api

# Use a different port if 8080 is in use
server.port=8080